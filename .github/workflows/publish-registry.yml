name: Publish Comfy Registry

on:
  push:
    branches: [master]
    paths:
      - "freefuse_comfyui/pyproject.toml"
      - ".github/workflows/publish-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comfy-registry-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare standalone ComfyUI package
        shell: bash
        run: |
          subtree_commit=$(git subtree split --prefix=freefuse_comfyui)
          git checkout --detach "$subtree_commit"
      - name: Check registry version
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, tomllib, urllib.request
          from pathlib import Path
          config = tomllib.loads(Path("pyproject.toml").read_text())
          version = config["project"]["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise ValueError("Release version must use major.minor.patch")
          with urllib.request.urlopen("https://api.comfy.org/nodes/freefuse", timeout=30) as response:
              latest = json.load(response).get("latest_version") or {}
          already_published = latest.get("version") == version
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
              output.write(f"publish={'false' if already_published else 'true'}\n")
          print(f"FreeFuse {version}: " + ("already published" if already_published else "ready to publish"))
          PY
      - name: Install and validate publishing tool
        if: steps.version.outputs.publish == 'true'
        run: |
          python -m pip install comfy-cli==1.23.0
          comfy --skip-prompt --no-enable-telemetry env
          comfy node validate
      - name: Publish version
        if: steps.version.outputs.publish == 'true'
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from comfy_cli.command.custom_nodes.command import publish
          token = os.environ.get("REGISTRY_ACCESS_TOKEN")
          if not token:
              raise SystemExit("Configure the REGISTRY_ACCESS_TOKEN repository secret, then rerun this workflow.")
          publish(token=token, changelog=Path("CHANGELOG.md").read_text(), changelog_file=None)
          PY
