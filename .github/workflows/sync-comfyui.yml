name: Sync comfyui branch

on:
  push:
    branches: [master] 
    paths:
      - "freefuse_comfyui/**"
      - ".github/workflows/sync-comfyui.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: sync-comfyui
      cancel-in-progress: true
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate ComfyUI subtree
        run: |
          python3 -m json.tool freefuse_comfyui/workflows/krea2_freefuse_with_editor.json >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 freefuse_comfyui/tests/test_krea2_static.py
          PYTHONPYCACHEPREFIX=/tmp/freefuse-pycache python3 -m py_compile freefuse_comfyui/scripts/update_krea2_readme_result.py
          bash -n freefuse_comfyui/scripts/pack_krea2_loras.sh
          bash -n freefuse_comfyui/scripts/setup_krea2_cuda_test.sh
          bash -n freefuse_comfyui/scripts/run_krea2_cuda_matrix.sh
          bash -n freefuse_comfyui/scripts/run_krea2_remote_full_test.sh

      - name: Split subtree and force-push comfyui
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=freefuse_comfyui -b comfyui-tmp
          git push --force origin comfyui-tmp:comfyui
